<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#292524" />
      <stop offset="70%" stop-color="#1c1917" />
      <stop offset="100%" stop-color="#0c0a09" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7" />
      <stop offset="30%" stop-color="#f59e0b" />
      <stop offset="70%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <circle cx="256" cy="256" r="236" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.4" />
  <circle cx="256" cy="256" r="226" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="6,6" stroke-opacity="0.6" />

  <!-- Sacred Trident / Vel Emblem -->
  <g filter="url(#goldGlow)" fill="url(#goldGrad)">
    <!-- Central Spearhead -->
    <path d="M256,90 L290,210 L266,220 L266,390 L246,390 L246,220 L222,210 Z" />
    <!-- Left Curve Prong -->
    <path d="M222,225 C170,210 150,140 160,110 C162,135 180,185 220,195 Z" />
    <circle cx="160" cy="110" r="7" />
    <!-- Right Curve Prong -->
    <path d="M290,225 C342,210 362,140 352,110 C350,135 332,185 292,195 Z" />
    <circle cx="352" cy="110" r="7" />
    <!-- Central Tip Pearl -->
    <circle cx="256" cy="85" r="9" />
    <!-- Crossguard -->
    <rect x="210" y="222" width="92" height="12" rx="6" />
    <!-- Base Lotus Petals -->
    <path d="M236,380 C236,405 210,415 200,420 C225,420 256,410 256,388 C256,410 287,420 312,420 C302,415 276,405 276,380 Z" />
  </g>

  <!-- Bottom Sacred Inscription -->
  <text x="256" y="460" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="900" fill="#fde68a" text-anchor="middle" letter-spacing="4">
    ONAMPILLY KAVADI
  </text>
</svg>
